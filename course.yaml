version: "1.0"

# Informações Gerais da Formação
course:
  id: "imersao-oracle-database-ia"
  title: "Imersão Oracle Database com IA"
  institution: "G. A. R de Brito Educacao"
  platform: "Hotmart"
  degree_level: "Imersão / Especialização"
  workload: "40h"
  track_role: "DBA / Engenharia de Banco de Dados e Inteligência Artificial"
  status: "Em Andamento"
  language: "pt-BR"

  # Referência documental da ementa detalhada
  syllabus_ref: "docs/ementa-disciplinas.md"

  description: >
    Imersão prática focada na administração de Oracle Database integrada a conceitos
    e recursos de Inteligência Artificial, abrangendo desde a instalação, configuração
    de ambiente e solução de erros comuns de deploy até padrões avançados de DBA.

# Declaração dos Módulos da Formação
# Cada chave corresponde ao slug da pasta em `modules/<slug>/`
# O loader aceita tanto este formato (mapa) quanto uma lista `- id: ...`.
modules:
  01-instalacao-e-fundamentos:
    id: "01"
    name: "Instalação e Fundamentos do Oracle Database"
    summary: "Configuração de ambiente, pré-requisitos de instalação e resolução de falhas de deploy."
    portal_order: 1
    previous_slugs: []
    competencies:
      - "Executar a instalação correta do Oracle Database contornando erros de plug-ins e logs"
      - "Compreender os componentes essenciais de infraestrutura de um DBA"
      - "Validar os logs de instalação e dependências do sistema operacional"

  02-gravacoes-e-praticas-avancadas:
    id: "02"
    name: "Imersão Oracle Database com IA - Gravações e Práticas"
    summary: "Acompanhamento das aulas gravadas, resolução de dúvidas da comunidade e integração com IA."
    portal_order: 2
    previous_slugs: []
    competencies:
      - "Aplicar conceitos práticos demonstrados nas aulas ao vivo e gravações"
      - "Integrar fluxos de banco de dados com recursos de IA"
      - "Diagnosticar e solucionar problemas comuns reportados na comunidade"
